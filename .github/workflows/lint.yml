name: Lint

on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
      - name: deno ci (frozen install)
        run: deno ci
      - name: Check formatting
        run: deno fmt --check
      - name: Lint
        run: deno lint
      - name: Discover workspace packages
        id: packages
        run: |
          chmod +x ./scripts/discover-packages.ts
          echo "list<<EOF" >> $GITHUB_OUTPUT
          ./scripts/discover-packages.ts >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Type check all packages
        run: |
          echo '${{ steps.packages.outputs.list }}' | jq -r '.[].entry' | xargs deno check
