name: Publish

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "packages/*/src/**"
      - "deno.json"
      - "packages/*/deno.json"
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish (all, snarl, varnish, imouto)"
        required: true
        type: choice
        options:
          - all
          - snarl
          - varnish
          - imouto
        default: "all"

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  discover:
    runs-on: ubuntu-latest
    needs: ci
    outputs:
      packages: ${{ steps.packages.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - name: Get workspace packages
        id: packages
        run: |
          json=$(
            if [ -f "deno.json" ]; then
              echo "{\"name\":\"$(jq -r '.name' deno.json)\",\"path\":\".\"}"
            fi
            for dir in $(find packages -maxdepth 2 -name deno.json -printf "%h\n" | sort -u 2>/dev/null || true); do
              echo "{\"name\":\"$(jq -r '.name' "$dir/deno.json")\",\"path\":\"$dir\"}"
            done | jq -s -c .)
          echo "list=$json" >> $GITHUB_OUTPUT

  publish:
    runs-on: ubuntu-latest
    needs: discover
    if: |
      github.event_name == 'push' ||
      github.event.inputs.package == 'all'
    strategy:
      matrix:
        package: ${{ fromJson(needs.discover.outputs.packages) }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Publish ${{ matrix.package.name }}
        working-directory: ${{ matrix.package.path }}
        run: deno publish

  publish-selected:
    runs-on: ubuntu-latest
    needs: discover
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.package != 'all'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Publish ${{ github.event.inputs.package }}
        env:
          SELECTED_PKG: ${{ github.event.inputs.package }}
          PACKAGES_JSON: ${{ needs.discover.outputs.packages }}
        run: |
          PACKAGE=$(echo "$PACKAGES_JSON" | jq -r --arg pkg "$SELECTED_PKG" '.[] | select(.name == $pkg or (.name | endswith("/" + $pkg))) | .path')
          if [ -z "$PACKAGE" ]; then
            echo "Package not found"
            exit 1
          fi
          cd "$PACKAGE" && deno publish
