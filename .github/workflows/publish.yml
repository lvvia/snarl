name: Publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        required: true
        type: choice
        options:
          - all
          - snarl
          - varnish
          - imouto
          - aether
        default: "all"

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  discover:
    runs-on: ubuntu-latest
    needs: ci
    outputs:
      packages: ${{ steps.packages.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Discover workspace packages
        id: packages
        run: |
          chmod +x ./scripts/discover-packages.ts
          echo "list<<EOF" >> $GITHUB_OUTPUT
          ./scripts/discover-packages.ts >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  publish-snarl:
    runs-on: ubuntu-latest
    needs: discover
    if: |
      github.event.inputs.package == 'all' ||
      github.event.inputs.package == 'snarl'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Get package info
        id: info
        run: |
          PACKAGES='${{ needs.discover.outputs.packages }}'
          PATH=$(echo "$PACKAGES" | jq -r '.[] | select(.name == "@july/snarl") | .path')
          echo "path=$PATH" >> $GITHUB_OUTPUT
      - name: Publish snarl
        if: steps.info.outputs.path != ''
        working-directory: ${{ steps.info.outputs.path }}
        run: deno publish

  publish-varnish:
    runs-on: ubuntu-latest
    needs: publish-snarl
    if: |
      github.event.inputs.package == 'all' ||
      github.event.inputs.package == 'varnish'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Get package info
        id: info
        run: |
          PACKAGES='${{ needs.discover.outputs.packages }}'
          PATH=$(echo "$PACKAGES" | jq -r '.[] | select(.name == "@404/varnish") | .path')
          echo "path=$PATH" >> $GITHUB_OUTPUT
      - name: Publish varnish
        if: steps.info.outputs.path != ''
        working-directory: ${{ steps.info.outputs.path }}
        run: deno publish

  publish-imouto:
    runs-on: ubuntu-latest
    needs: publish-varnish
    if: |
      github.event.inputs.package == 'all' ||
      github.event.inputs.package == 'imouto'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Get package info
        id: info
        run: |
          PACKAGES='${{ needs.discover.outputs.packages }}'
          PATH=$(echo "$PACKAGES" | jq -r '.[] | select(.name == "@404/imouto") | .path')
          echo "path=$PATH" >> $GITHUB_OUTPUT
      - name: Publish imouto
        if: steps.info.outputs.path != ''
        working-directory: ${{ steps.info.outputs.path }}
        run: deno publish

  publish-aether:
    runs-on: ubuntu-latest
    needs: publish-imouto
    if: |
      github.event.inputs.package == 'all' ||
      github.event.inputs.package == 'aether'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Get package info
        id: info
        run: |
          PACKAGES='${{ needs.discover.outputs.packages }}'
          PATH=$(echo "$PACKAGES" | jq -r '.[] | select(.name == "@404/aether") | .path')
          echo "path=$PATH" >> $GITHUB_OUTPUT
      - name: Publish aether
        if: steps.info.outputs.path != ''
        working-directory: ${{ steps.info.outputs.path }}
        run: deno publish
